name: Refresh event data

# Re-scrapes every source and commits the new data/events.json.
# Vercel redeploys on that push by itself; GitHub Pages is kicked off
# explicitly at the end, because a push made with GITHUB_TOKEN does not
# trigger other workflows.

on:
  schedule:
    # Every Monday at 04:17 UTC (06:17 Danish summer time)
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape all sources
        run: python3 scripts/build_data.py

      - name: Commit updated data
        id: commit
        run: |
          if git diff --quiet -- data/events.json; then
            echo "No changes in data/events.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Automatisk dataopdatering $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${{ github.ref_name }}"

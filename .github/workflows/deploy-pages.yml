name: Deploy to GitHub Pages

on:
  push:
    # Repo currently has no "main" -- claude/artist-performance-search-vcywg7
    # is the actual default branch. Both are listed so this still fires if
    # the repo later gets a conventional main branch.
    branches:
      - main
      - claude/artist-performance-search-vcywg7
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload repository root as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
